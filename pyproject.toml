[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrine"
version = "0.1.0"
description = "Remise en vente assistée des cartes Sorare — lecture, plan éditable, exécution sous contrôle."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pynacl>=1.5",   # signature ed25519 (rail Solana) — cf. src/vitrine/solana_signature.py
    "base58>=2.1",   # encodage des adresses/signatures Solana
    "keyring>=25.0", # stockage de la clé privée Ethereum (gestionnaire d'identifiants Windows)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "bcrypt>=4",  # uniquement pour l'outil de génération de JWT — hors runtime
]

[project.scripts]
vitrine = "vitrine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
